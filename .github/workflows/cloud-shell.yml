name: cloud-shell
on:
  workflow_dispatch:
    inputs:
      job:
        description: job script path
        required: true
      artifact:
        description: artifact glob (default out/**)
        required: false
        default: out/**
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          echo "=== machine ==="
          uname -a; nproc; free -h | head -2; df -h / | tail -1
          echo "=== job: ${{ inputs.job }} ==="
          chmod +x "${{ inputs.job }}" || true
          set +e
          bash "${{ inputs.job }}" 2>&1 | tee output.log
          code=${PIPESTATUS[0]}
          echo "__EXIT_CODE__=$code" | tee -a output.log
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output
          path: |
            output.log
            ${{ inputs.artifact }}
          if-no-files-found: warn
          overwrite: true
